planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 40.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.5
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.2
      lookahead_dist: 3.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 5.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.3
      # An Ackermann car cannot pivot in place; turning while driving is safer.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 3.14
      allow_reversing: false
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 1.2
      resolution: 0.2
      rolling_window: true
      width: 16
      height: 16
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Points are height-filtered relative to base_link upstream; Nav2 sees
        # their absolute odom z (about 52 m in Town).
        min_obstacle_height: -1000.0
        max_obstacle_height: 1000.0
        observation_sources: cloud clearing_cloud
        cloud:
          topic: /wildos/points
          # cloud_filter height-clips in base_link; odom/map z is absolute.
          max_obstacle_height: 1000.0
          min_obstacle_height: -1000.0
          data_type: "PointCloud2"
          marking: true
          clearing: false
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
        clearing_cloud:
          topic: /wildos/clearing_points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.6
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 1.2
      resolution: 0.25
      track_unknown_space: true
      rolling_window: true
      width: 80
      height: 80
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Points are height-filtered relative to base_link upstream; Nav2 sees
        # their absolute odom z (about 52 m in Town).
        min_obstacle_height: -1000.0
        max_obstacle_height: 1000.0
        observation_sources: cloud clearing_cloud
        cloud:
          topic: /wildos/points
          # cloud_filter height-clips in base_link; odom/map z is absolute.
          max_obstacle_height: 1000.0
          min_obstacle_height: -1000.0
          data_type: "PointCloud2"
          marking: true
          clearing: false
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
        clearing_cloud:
          topic: /wildos/clearing_points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          raytrace_max_range: 30.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 2.0
      always_send_full_costmap: true
