visual_memory_map_enabled: true
visual_memory_map_path: ':memory:'
visual_memory_map_id: default
visual_memory_map_save_images: false
visual_memory_map_image_root: ~/.ros/wildos_memory_images

keyframe_min_translation: 3.0
keyframe_min_rotation_deg: 25.0
keyframe_min_embedding_distance: 0.18

# Graph-anchored update policy. Node/heading changes always create/update their
# own record; this threshold only controls repeated observations in the same bin.
node_observation_min_embedding_distance: 0.18

place_recognition:
  top_k: 10
  visual_similarity_threshold: 0.82
  confirmed_threshold: 0.88
  max_yaw_difference_deg: 55.0

object_association:
  max_position_distance: 3.0
  min_embedding_similarity: 0.82
  confirmation_observations: 2
  independent_heading_bins: 2
  prototype_novelty_threshold: 0.95
  heading_utility_weight: 0.2

query:
  direct_goal_threshold: 0.85
  verify_goal_threshold: 0.60
  stale_object_threshold: 0.45

decay:
  static_half_life: 31536000.0
  semi_static_half_life: 3600.0
  dynamic_half_life: 10.0

negative_memory:
  enabled: true
  min_heading_coverage: 0.7
  penalty_weight: 2.0

feedback:
  failure_penalty: 5.0
  collision_penalty: 20.0
  success_bonus: 3.0
