# Original WildOS algorithm parameters; only deployment paths and BeamNG topics/frames differ.
ckpt_root: /home/ly/ckpts
model_version: c-radio_v3-b_half.pth.tar
adaptor_version: siglip2
adaptor_ckpt_path: /home/ly/ckpts/siglip2
local_files_only: true
frontier_ckpt: frontier_head.ckpt
traversability_ckpt: trav_head.ckpt
use_naclip: true
use_summary_for_spatial: true
radio_dim: 768
static_scale_factor: 0.75
model_precision: FP16

num_cameras: 1
cams_inverted: false
num_angular_bins: 16
reach_in_2D: true

# One observed-distance bound for visual projection and point-cloud filtering.
# This limits observations; it does not declare terrain traversable.
observation_range_m: &observation_range_m 40.0
frontiers_range: *observation_range_m
traversability_class: default
heading_sim_thresh: 0.0
default_max_score: 0.3
std_for_default_scores: 80.0
std_for_frontier_heading: null
min_frontier_separation: 0.75

frontier_threshold: 0.6
frontier_opening_kernel_size: 20
traversability_threshold: 0.9
frontier_w: 2.0
goal_w: 3.0
reachability_w: 2.0
scoring_method: MULTIPLICATIVE
reach_scale: 0.25
compute_paths: true

parent_frame: spot1/odom
cam_frame: spot1/realsense/{}_color_optical_frame
camera_img_topic: /spot1/realsense/{}/color/image_raw
camera_info_topic: /spot1/realsense/{}/color/camera_info
odometry_topic: /spot1/odom
navigation_graph_topic: /spot1/nav_graph_perception

scored_navgraph_topic: /spot1/scored_nav_graph
object_mask_topic: /spot1/object_mask
model_viz_topic: /spot1/model_visualization
valid_geofrontiers_topic: /spot1/within_range_geofrontiers
score_ring_topic: /spot1/score_rings
graph_viz_topic: /spot1/nav_graph_viz

qos_history_depth: 1
syncsub_queue_size: 10
syncsub_slop: 0.05

object_search_config:
  text_queries: [door]
  pixel_level_seg: false
  mask_threshold: 0.08
  obj_frontier_score: 0.9

tf_lookup_config:
  buffer_size: 1
  cache_time: 10
  timer_duration: 0.1
  lookup_timeout: 0
  # TF messages carry separate base, navigation and camera edges. Keep their
  # small messages through model inference so the LiDAR chain stays current.
  qos_history_depth: 100
  wait_for_oldest: false
  clear_buffer_on_process: true
  spin_thread: false

# Controlled baseline: only newly added memory priors disabled.
visual_memory_enabled: false
visual_memory_map_enabled: false
semantic_landmark_memory_enabled: false
