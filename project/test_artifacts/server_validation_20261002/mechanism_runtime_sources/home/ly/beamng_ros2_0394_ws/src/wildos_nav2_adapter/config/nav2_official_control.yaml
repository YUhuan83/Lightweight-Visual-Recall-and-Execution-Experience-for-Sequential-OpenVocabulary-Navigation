planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: [GridBased, CarLike]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 1.0
      use_astar: true
    CarLike:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 1.0
      allow_unknown: true
      max_iterations: 300000
      max_on_approach_iterations: 1000
      # Smac holds the costmap lock while planning. Keep that pause plus the
      # publication interval below the bridge's 3 s freshness guard.
      max_planning_time: 1.5
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 50.0
      # 2026-10-02 measured rear-axle radius at the 0.6 input cap: 7.407 m.
      # The rear-axle base frame and measured 2.501 m wheelbase are shared
      # with the actuator bridge; retain a conservative 8 m planned radius.
      minimum_turning_radius: 8.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      lookup_table_size: 20.0

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker, maneuver_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 40.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.7
      stateful: true
    # Stop close to a gear-change cusp before the next motion section starts.
    maneuver_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.35
      stateful: false
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 1.2
      lookahead_dist: 3.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 5.0
      lookahead_time: 1.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.3
      use_rotate_to_heading: false
      allow_reversing: true
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: spot1/odom
      # Planar rear axle; physical spot1/base_link retains sensor roll/pitch/z.
      robot_base_frame: spot1/nav_base_link
      use_sim_time: false
      # SBR footprint relative to the rear axle, including body margin.
      footprint: '[[3.4, 1.05], [3.4, -1.05], [-1.05, -1.05], [-1.05, 1.05]]'
      footprint_padding: 0.01
      resolution: 0.2
      rolling_window: true
      width: 16
      height: 16
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Points are height-filtered relative to base_link upstream; Nav2 sees
        # their absolute odom z (about 52 m in Town).
        min_obstacle_height: -1000.0
        max_obstacle_height: 1000.0
        observation_sources: cloud clearing_cloud
        cloud:
          topic: /wildos/points
          sensor_frame: spot1/ouster/front/os_lidar
          # cloud_filter height-clips in base_link; odom/map z is absolute.
          max_obstacle_height: 1000.0
          min_obstacle_height: -1000.0
          data_type: PointCloud2
          marking: true
          clearing: false
          raytrace_max_range: 15.0
          obstacle_max_range: 12.0
        clearing_cloud:
          topic: /wildos/clearing_points
          sensor_frame: spot1/ouster/front/os_lidar
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.6
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: spot1/odom
      robot_base_frame: spot1/nav_base_link
      use_sim_time: false
      footprint: '[[3.4, 1.05], [3.4, -1.05], [-1.05, -1.05], [-1.05, 1.05]]'
      footprint_padding: 0.01
      resolution: 0.25
      track_unknown_space: true
      rolling_window: true
      width: 80
      height: 80
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Points are height-filtered relative to base_link upstream; Nav2 sees
        # their absolute odom z (about 52 m in Town).
        min_obstacle_height: -1000.0
        max_obstacle_height: 1000.0
        observation_sources: cloud clearing_cloud
        cloud:
          topic: /wildos/points
          sensor_frame: spot1/ouster/front/os_lidar
          # cloud_filter height-clips in base_link; odom/map z is absolute.
          max_obstacle_height: 1000.0
          min_obstacle_height: -1000.0
          data_type: PointCloud2
          marking: true
          clearing: false
          raytrace_max_range: 30.0
          obstacle_max_range: 25.0
        clearing_cloud:
          topic: /wildos/clearing_points
          sensor_frame: spot1/ouster/front/os_lidar
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          raytrace_max_range: 30.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 2.0
      always_send_full_costmap: true
