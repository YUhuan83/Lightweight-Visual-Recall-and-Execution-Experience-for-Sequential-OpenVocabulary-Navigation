num_cameras: 1
parent_frame: spot1/odom
cam_frame: spot1/realsense/{}_color_optical_frame
lidar_frame: spot1/ouster/front/os_lidar
object_mask_topic: /spot1/object_mask
lidar_topic: /spot1/ouster/front/points_for_localization

triangulated_object_topic: /spot1/triangulated_object
navigation_goal_topic: /spot1/raw_object_waypoint
particle_viz_topic: /spot1/object_hypotheses

qos_history_depth: 10
# BeamNG.tech's documented LiDAR update period is 0.05 s (20 Hz). Retain
# five seconds so a scan can survive the measured 2–3.6 s visual inference
# delay. At 30k XYZ points per cloud, 100 entries are at most about 36 MB of
# raw point data; runtime sensor rate must still be recorded because a
# scenario can override the sensor period.
syncsub_queue_size: 100
syncsub_slop: 0.1
camera_mask_max_skew_sec: 0.05
max_views: 12
min_lidar_points: 20
sparse_lidar_points: 8
observation_timeout_sec: 5.0
min_view_distance: 1.0
particle_generator_config:
  num_particles: 1000
  depth_range: [1.0, 100.0]
  add_odom_drift: false
use_mask_for_projection: true
buffer_size: 10
timer_duration: 0.2
