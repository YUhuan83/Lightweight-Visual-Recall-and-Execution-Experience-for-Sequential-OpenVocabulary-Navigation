controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: true
      approach_velocity_scaling_dist: 2.0
      desired_linear_vel: 1.2
      lookahead_dist: 3.0
      lookahead_time: 2.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 1.5
      max_lookahead_dist: 6.0
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.2
      min_lookahead_dist: 3.0
      minimum_turning_radius: 8.0
      plugin: wildos_ackermann_rpp/Controller
      regulated_linear_scaling_min_radius: 8.0
      regulated_linear_scaling_min_speed: 0.3
      transform_tolerance: 0.5
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    cusp_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      rot_stopped_velocity: 0.05
      stateful: false
      trans_stopped_velocity: 0.05
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.7
    goal_checker_plugins:
    - goal_checker
    - maneuver_goal_checker
    - cusp_goal_checker
    maneuver_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.35
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    odom_topic: /spot1/odom
    progress_checker:
      movement_time_allowance: 100.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
    progress_checker_plugin: progress_checker
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[3.4, 1.05], [3.4, -1.05], [-1.05, -1.05], [-1.05, 1.05]]'
      footprint_padding: 0.01
      global_frame: spot1/odom
      height: 30
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.6
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        clearing_cloud:
          clearing: true
          data_type: PointCloud2
          marking: false
          max_obstacle_height: 1000.0
          min_obstacle_height: -1000.0
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          sensor_frame: spot1/lidar_ray_origin
          topic: /wildos/clearing_points
        cloud:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 1000.0
          min_obstacle_height: -1000.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
          sensor_frame: spot1/lidar_ray_origin
          topic: /wildos/points
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 1000.0
        min_obstacle_height: -1000.0
        observation_sources: cloud clearing_cloud
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.2
      robot_base_frame: spot1/nav_base_link
      rolling_window: true
      track_unknown_space: false
      update_frequency: 20.0
      use_sim_time: false
      width: 30
