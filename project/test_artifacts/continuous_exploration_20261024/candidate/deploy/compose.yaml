services:
  simulator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    shm_size: 2gb
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      ROS_DOMAIN_ID: "42"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../assets:/workspace/assets:ro
      - ../config:/workspace/config:ro
  bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "42"
    volumes:
      - ../config:/workspace/config:ro
    command: [bash, /workspace/deploy/run.sh, bridge]
