planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: [GridBased, CarLike]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 1.0
      use_astar: true
    CarLike:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 1.0
      allow_unknown: true
      max_iterations: 300000
      max_on_approach_iterations: 1000
      max_planning_time: 1.5
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 50.0
      minimum_turning_radius: 8.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      lookup_table_size: 20.0

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /spot1/odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker, maneuver_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 40.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.7
      stateful: true
    maneuver_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.35
      stateful: false
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 1.2
      lookahead_dist: 3.0
      min_lookahead_dist: 3.0
      max_lookahead_dist: 6.0
      lookahead_time: 2.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 8.0
      regulated_linear_scaling_min_speed: 0.3
      use_rotate_to_heading: false
      allow_reversing: true
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: spot1/odom
      robot_base_frame: spot1/nav_base_link
      use_sim_time: false
      track_unknown_space: false
      footprint: '[[3.4, 1.05], [3.4, -1.05], [-1.05, -1.05], [-1.05, 1.05]]'
      footprint_padding: 0.01
      resolution: 0.2
      rolling_window: true
      width: 16
      height: 16
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: ''
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.6
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: spot1/odom
      robot_base_frame: spot1/nav_base_link
      use_sim_time: false
      track_unknown_space: false
      footprint: '[[3.4, 1.05], [3.4, -1.05], [-1.05, -1.05], [-1.05, 1.05]]'
      footprint_padding: 0.01
      resolution: 0.25
      rolling_window: true
      width: 80
      height: 80
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: ''
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 2.0
      always_send_full_costmap: true
