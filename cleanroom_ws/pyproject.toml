[tool.ruff]
target-version = "py310"
extend-exclude = [
  "vendor", "build", "install", "log", "runs",
  "src/beamng_ros2", "src/beamng_msgs", "src/pose_graph_msgs",
  "src/grid_map_core", "src/grid_map_cv", "src/grid_map_ros",
  "src/grid_map_msgs", "src/grid_map_cmake_helpers", "src/graaf_vendor",
  "src/triangulation3d",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
